  <path d="M182 435c-58-109 47-160 56-218 13-91 89-126 179-78 65 35 100 16 163 61 83 59 57 143 19 190-43 54 30 142-47 199-63 47-102 4-175 17-68 13-158-29-195-171Z" fill="url(#glass)" stroke="url(#rim)" stroke-width="5"/>
