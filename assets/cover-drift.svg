<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Drift — original WAVE cover artwork</title>
  <desc id="desc">A translucent blue glass form suspended in a soft blue field.</desc>
  <defs>
    <linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#bfd9eb"/><stop offset=".46" stop-color="#80b4d1"/><stop offset="1" stop-color="#365ba0"/></linearGradient>
    <linearGradient id="glass" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#e3fbff" stop-opacity=".95"/><stop offset=".2" stop-color="#a6e7fb" stop-opacity=".38"/><stop offset=".42" stop-color="#1c73ba" stop-opacity=".87"/><stop offset=".62" stop-color="#a2e8f9" stop-opacity=".78"/><stop offset=".84" stop-color="#1c69ac"/><stop offset="1" stop-color="#bdedfa"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#f4ffff"/><stop offset=".36" stop-color="#c1ffff" stop-opacity=".6"/><stop offset=".6" stop-color="#1262a9"/><stop offset="1" stop-color="#d5fbff"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#edffff" stop-opacity=".8"/><stop offset="1" stop-color="#c5eaff" stop-opacity="0"/></radialGradient>
