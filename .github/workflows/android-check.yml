name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'index.html'
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/build.mjs'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'package.json'
      - 'index.html'
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/build.mjs'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled offline player
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test bundled asset path boundaries
        run: |
          mkdir -p android/.tmp/path-tests
          javac -d android/.tmp/path-tests android/app/src/main/java/io/github/daronthedragon/waveplayer/BundlePath.java android/tests/BundlePathTest.java
          java -cp android/.tmp/path-tests io.github.daronthedragon.waveplayer.BundlePathTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, lint, and build unsigned release
        working-directory: android
        run: gradle --no-daemon lintDebug assembleDebug assembleRelease
      - name: Save unsigned release for local signing
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-Android-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
