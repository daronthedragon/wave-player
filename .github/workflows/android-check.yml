name: Android checks

on:
  push:
    branches: [main, codex/android-native]
    paths:
      - 'android/**'
      - 'package.json'
      - 'index.html'
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/build.mjs'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'package.json'
      - 'index.html'
      - 'src/**'
      - 'assets/**'
      - 'vendor/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/build.mjs'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:
    inputs:
      live_audio:
        description: 'Test actual public YouTube and SoundCloud downloads on the emulator'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled offline player
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test bundled asset path boundaries
        run: |
          mkdir -p android/.tmp/path-tests
          javac -d android/.tmp/path-tests android/app/src/main/java/io/github/daronthedragon/waveplayer/BundlePath.java android/tests/BundlePathTest.java
          java -cp android/.tmp/path-tests io.github.daronthedragon.waveplayer.BundlePathTest
          javac -d android/.tmp/path-tests android/app/src/main/java/io/github/daronthedragon/waveplayer/AudioLink.java android/tests/AudioLinkTest.java
          java -cp android/.tmp/path-tests io.github.daronthedragon.waveplayer.AudioLinkTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, lint, and build unsigned release
        working-directory: android
        run: gradle --no-daemon lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Save unsigned release for local signing
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-Android-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify on-device downloader runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 15's emulator image disconnected during native process
          # startup on this runner. Android 14 keeps a modern WebView while
          # independently verifying the APK's API 26+ native extraction path.
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -memory 2048 -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash android/run-device-checks.sh ${{ github.ref == 'refs/heads/codex/android-native' || inputs.live_audio == true }}
      - name: Save Android runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/.tmp/device-diagnostics/
          if-no-files-found: ignore
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
