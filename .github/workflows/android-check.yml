name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'package.json'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and lint debug app
        working-directory: android
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
