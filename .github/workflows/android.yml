name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build for local signing (for example v1.2.2)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || { echo 'Tag must match package.json version.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled offline player
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test bundled asset path boundaries
        run: |
          mkdir -p android/.tmp/path-tests
          javac -d android/.tmp/path-tests android/app/src/main/java/io/github/daronthedragon/waveplayer/BundlePath.java android/tests/BundlePathTest.java
          java -cp android/.tmp/path-tests io.github.daronthedragon.waveplayer.BundlePathTest
          javac -d android/.tmp/path-tests android/app/src/main/java/io/github/daronthedragon/waveplayer/AudioLink.java android/tests/AudioLinkTest.java
          java -cp android/.tmp/path-tests io.github.daronthedragon.waveplayer.AudioLinkTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint unsigned release APK
        working-directory: android
        run: gradle --no-daemon lintRelease assembleRelease
      - name: Save unsigned APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: WAVE-Android-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
