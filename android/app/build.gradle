plugins { id 'com.android.application' }

def packageInfo = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def versionParts = packageInfo.version.tokenize('.').collect { it.toInteger() }
def releaseStore = System.getenv('WAVE_KEYSTORE_PATH')
def webDist = file('../../dist')
def generatedWebAssets = layout.buildDirectory.dir('generated/waveAssets')

tasks.register('validatePackagedExtractor') {
    inputs.file('src/main/res/raw/ytdlp')
    doLast {
        def payload = file('src/main/res/raw/ytdlp')
        def expected = '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6'
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(payload.bytes).encodeHex().toString()
        if (actual != expected) throw new GradleException('Packaged yt-dlp checksum mismatch. Use the pinned official release asset.')
    }
}

// Both CI and local builds run the website build first. Package its real shell,
// not the large single-file desktop download or any server/private files.
tasks.register('validateWebBuild') {
    doLast {
        for (String required : ['index.html', 'src/main.js', 'src/styles.css', 'manifest.webmanifest', 'vendor/ffmpeg/ffmpeg-core.wasm']) {
            if (!new File(webDist, required).isFile()) {
                throw new GradleException('Missing web build. Run npm run build in the repository root first.')
            }
        }
    }
}
tasks.register('bundleWebPlayer', Sync) {
    dependsOn 'validateWebBuild'
    from(webDist) {
        include 'index.html', 'manifest.webmanifest', 'sw.js', 'LICENSE'
        include 'src/**', 'assets/**', 'vendor/**'
    }
    into generatedWebAssets.map { it.dir('wave') }
}

android {
    namespace 'io.github.daronthedragon.waveplayer'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.daronthedragon.waveplayer'
        minSdk 26
        targetSdk 36
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName packageInfo.version
        testInstrumentationRunner 'io.github.daronthedragon.waveplayer.WaveTestRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('WAVE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WAVE_KEY_ALIAS')
                keyPassword System.getenv('WAVE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    packaging {
        // Python and QuickJS are native executables, loaded from nativeLibraryDir.
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/DEPENDENCIES'] }
    }
    sourceSets.main.assets.srcDir(generatedWebAssets)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.named('preBuild').configure { dependsOn 'bundleWebPlayer', 'validatePackagedExtractor' }
